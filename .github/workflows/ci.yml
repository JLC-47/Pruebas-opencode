name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas y verificar cobertura
        run: mvn -B clean verify

      - name: Publicar reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/main/resources/frontend
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/main/resources/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato
        run: npm run format:check

      - name: Ejecutar pruebas del frontend
        run: npm run test:ci

      - name: Compilar el frontend
        run: npm run build

  compose:
    name: Configuracion de Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JWT_SECRET: Y2xhdmUtc3VwZXItc2VndXJhLXBhcmEtZGVzYXJyb2xsby1sb2NhbC0yMDI2LXByb2R1Y3Rvcy1hcGk=
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet
