services:
  db:
    image: mysql:8.4
    container_name: productos-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: pruebas_db
      MYSQL_USER: ${DB_USERNAME:-productos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-productos123}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/pruebas_db.sql:/docker-entrypoint-initdb.d/01-pruebas_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: productos-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/pruebas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-productos}
      DB_PASSWORD: ${DB_PASSWORD:-productos123}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_PROFILES_ACTIVE: dev
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_ADMIN_USERNAME: ${APP_SEED_ADMIN_USERNAME:-admin}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-admin123}
      APP_SEED_USER_USERNAME: ${APP_SEED_USER_USERNAME:-user}
      APP_SEED_USER_PASSWORD: ${APP_SEED_USER_PASSWORD:-user123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mysql_data:
