spring:
  application:
    name: productos-api

  datasource:
    url: jdbc:mysql://localhost:3306/tienda_db
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  web:
    error:
      include-message: always

server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET:Y2xhdmUtc3VwZXItc2VndXJhLXBhcmEtZGVzYXJyb2xsby1sb2NhbC0yMDI2LXByb2R1Y3Rvcy1hcGk=}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:20}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
    admin:
      username: ${APP_SEED_ADMIN_USERNAME:admin}
      password: ${APP_SEED_ADMIN_PASSWORD:admin123}
    user:
      username: ${APP_SEED_USER_USERNAME:user}
      password: ${APP_SEED_USER_PASSWORD:user123}

info:
  app:
    name: ${spring.application.name}
    description: API REST de productos con Spring Boot
    version: 0.0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
