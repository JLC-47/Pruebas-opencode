<section class="page page-narrow">
  <header class="page-header">
    <div>
      <h1>{{ editando() ? 'Editar producto' : 'Nuevo producto' }}</h1>
      <p class="muted">
        {{ editando() ? 'Actualiza los datos del producto.' : 'Completa los datos para registrar un producto.' }}
      </p>
    </div>
    <a class="btn" routerLink="/productos">Volver</a>
  </header>

  @if (error()) {
    <div class="alert alert-error">{{ error() }}</div>
  }

  @if (cargando()) {
    <div class="state-box">Cargando producto...</div>
  } @else {
    <form class="card form" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
      <label class="field">
        <span>Nombre</span>
        <input
          class="input"
          type="text"
          formControlName="nombre"
          maxlength="120"
          placeholder="Ej. Laptop"
        />
        @if (form.controls.nombre.touched && form.controls.nombre.invalid) {
          <small class="error-text">El nombre es obligatorio y admite hasta 120 caracteres.</small>
        }
      </label>

      <div class="grid-2">
        <label class="field">
          <span>Precio</span>
          <input class="input" type="number" formControlName="precio" min="0" step="0.01" />
          @if (form.controls.precio.touched && form.controls.precio.invalid) {
            <small class="error-text">
              El precio debe ser mayor o igual a 0 y tener maximo 2 decimales.
            </small>
          }
        </label>

        <label class="field">
          <span>Stock</span>
          <input class="input" type="number" formControlName="stock" min="0" step="1" />
          @if (form.controls.stock.touched && form.controls.stock.invalid) {
            <small class="error-text">El stock debe ser un numero entero mayor o igual a 0.</small>
          }
        </label>
      </div>

      <label class="field">
        <span>Categoria</span>
        <select class="input" formControlName="categoria">
          <option value="">Sin categoria</option>
          @for (categoria of categorias; track categoria) {
            <option [value]="categoria">{{ categoria }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span>Descripcion</span>
        <textarea
          class="input textarea"
          formControlName="descripcion"
          maxlength="300"
          rows="3"
          placeholder="Describe brevemente el producto"
        ></textarea>
        @if (form.controls.descripcion.touched && form.controls.descripcion.invalid) {
          <small class="error-text">La descripcion admite hasta 300 caracteres.</small>
        }
      </label>

      <div class="form-actions">
        <a class="btn" routerLink="/productos">Cancelar</a>
        <button class="btn btn-primary" type="submit" [disabled]="guardando()">
          {{ guardando() ? 'Guardando...' : (editando() ? 'Actualizar' : 'Crear producto') }}
        </button>
      </div>
    </form>
  }
</section>
